<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WSL 验收进度</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"><script defer src="/icons.js"></script><script defer src="/app.js"></script></head><body>
<header class="topbar"><div class="brand"><span class="brand-mark">W</span><div><strong>WSL 验收进度</strong><span class="muted">本机 Linux · 所有项目共用</span></div></div><div class="run-tools"><label class="history-label"><span id="history-caption">运行记录</span> <select id="history" aria-label="选择运行记录"><option>正在读取</option></select></label><button type="button" id="refresh">刷新状态</button></div><span id="connection" class="connection idle" role="status">等待数据</span></header>
<main><div class="workbench"><aside id="task-nav" class="task-sidebar"><div class="task-heading"><strong>全部项目任务</strong></div><div class="task-controls"><div id="task-count" class="task-summary" aria-label="任务状态统计">—</div><button id="task-toggle" type="button" aria-expanded="false" aria-controls="tasks"><span id="task-toggle-icon"></span><span id="task-toggle-label">任务</span></button></div><nav id="tasks" aria-label="跨项目任务与队列"></nav><p class="task-note">队列由执行端上报；查看器不安排执行。</p></aside><div class="task-detail"><section class="run-header"><div class="eyebrow">当前任务</div><div class="title-row"><h1 id="run-name">正在读取任务</h1><span id="run-state" class="badge">连接中</span></div><div class="run-meta"><span id="projects">—</span><span id="started">—</span><span id="elapsed">—</span><span id="queue"></span><span id="run-context"></span></div><div id="run-disclosures" class="run-disclosures"><details id="activity" class="activity" name="run-inspection"><summary><span id="activity-chevron"></span><span>当前进展</span><span id="activity-summary"></span></summary><div id="activity-content" class="activity-content"></div></details><details id="failure" class="failure" name="run-inspection" hidden><summary><span id="failure-chevron"></span><span id="failure-status-icon"></span><span>失败详情</span><span id="failure-summary"></span></summary><div id="failure-content" class="failure-content"></div></details><details id="source-info" class="source" name="run-inspection"><summary><span id="source-info-chevron"></span><span>源码版本与环境</span></summary><div class="source-content"><div id="environment"></div><div id="versions"></div></div></details></div></section>
<section class="workspace"><aside class="sidebar"><div class="sidebar-title"><strong>执行阶段</strong><span id="step-count">—</span></div><div class="mobile-stage-control"><label for="stage-picker">阶段 <span id="mobile-step-count">—</span></label><select id="stage-picker" aria-label="选择执行阶段"><option value="">暂无阶段</option></select></div><nav id="steps" aria-label="验收阶段"></nav><div class="sidebar-footer" id="test-count">测试统计将在执行后显示</div></aside><section class="log-panel"><header class="log-header"><div><h2 id="step-name">选择一个阶段</h2><p id="step-detail"></p></div><span id="step-state" class="badge">等待</span></header><div class="step-meta" id="step-meta"></div><div id="command" class="command" hidden></div><div class="log-toolbar"><span id="log-summary">实时日志</span><label><input type="checkbox" id="follow" checked> 跟随最新日志</label><button type="button" id="copy" disabled>复制日志</button></div><div class="log-view" id="log-view" role="log" aria-label="当前阶段日志" aria-live="off"><div id="log-empty" class="log-empty">此阶段尚未产生日志</div><pre id="log"></pre></div><div class="log-bottom"><span id="log-size">0 B</span><span id="updated">自动更新</span></div></section></section>
<footer class="page-footer"><span>执行由各项目验收脚本负责，页面仅展示实际上报的记录。</span><span>手动启动 · 本机访问</span></footer></div></div></main>
</body></html>
